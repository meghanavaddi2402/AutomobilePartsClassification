
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Parts Classifier</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: url('https://c4.wallpaperflare.com/wallpaper/522/4/864/abstract-car-sports-car-parts-mechanics-ferrari-exploded-view-diagram-composite-wallpaper-preview.jpg') no-repeat center center/cover;
            position: relative;
        }

        /* Dark overlay for better visibility */
        body::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            top: 0;
            left: 0
            
        }

        .container {
            position: relative;
            z-index: 1;

            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            padding: 2.5em;
            border-radius: 15px;
            text-align: center;
            color: white;

            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            width: 350px;

            animation: fadeIn 1s ease-in-out;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 1.8em;
        }

        .tagline {
            font-size: 0.9em;
            color: #ddd;
            margin-bottom: 20px;
        }

        /* Custom File Upload */
        .file-upload {
            display: inline-block;
            padding: 10px 20px;
            background: rgb(126, 106, 106);
            color: rgb(240, 233, 233);
            border-radius: 25px;
            cursor: pointer;
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        .file-upload input {
            display: none;
        }

        #file-name {
            margin-top: 2px;
            font-size: 0.85em;
            color: #ddd;
        }

        /* Upload Button */
        input[type="submit"] {
            background: linear-gradient(45deg, #632f2f, #4f1207);
            color: rgb(240, 233, 233);
            border: none;
            padding: 0.6em 2em;
            font-size: 1em;
            cursor: pointer;
            border-radius: 25px;
            transition: 0.3s;
        }

        input[type="submit"]:hover {
            transform: scale(1.05);
            background: linear-gradient(45deg, #632f2f, #4f1207);
        }

        /* Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1> Auto Parts Classifier</h1>
        <p class="tagline">AI-powered Automobile Component Detection System</p>

        <form action="{{ url_for('predict') }}" method="post" enctype="multipart/form-data">

            <label class="file-upload">
                Choose Image
                <input type="file" name="file" id="fileInput" accept="image/*" required>
            </label>
            <p id="file-name">No file chosen</p>
            <input type="submit" value="Upload & Predict">
        </form>
    </div>
    <script>
        const fileInput = document.getElementById('fileInput');
        const fileNameDisplay = document.getElementById('file-name');

        fileInput.addEventListener('change', function() {
            if (this.files.length > 0) {
                fileNameDisplay.textContent = "Selected: " + this.files[0].name;
            } else {
                fileNameDisplay.textContent = "No file chosen";
            }
        });
    </script>

</body>
</html>
